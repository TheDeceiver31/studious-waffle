<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A playful, heartfelt lotus-themed message for Khushi.">
    <meta name="theme-color" content="#081717">
    <meta property="og:type" content="website">
    <meta property="og:title" content="For Khushi 💕">
    <meta property="og:description" content="A playful, heartfelt lotus-themed message for Khushi.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="For Khushi 💕">
    <meta name="twitter:description" content="A playful, heartfelt lotus-themed message for Khushi.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=DM+Serif+Display:ital@0;1&family=Dancing+Script:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&family=Great+Vibes&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>For Khushi 💕 | A Little Something Special</title>
</head>

<body>

    <!-- Romantic Header & Interactive Card -->
    <header class="header-container">
        <h1 class="text">Baat to nhi kr pata socha code krke puch leta</h1>

        <!-- Interactive Card to Ask Number -->
        <div class="ask-card" id="askCard">
            <p class="card-subtitle" style>Tumhara number hona mam, Khushi ji? 👉👈</p>
            <div class="card-buttons">
                <button class="btn btn-yes" id="btnYes">Hau </button>
                <button class="btn btn-no" id="btnNo">Nkko </button>
            </div>
        </div>

        <!-- Success Modal / Response Box -->
        <div class="success-box hidden" id="successBox">
            <div class="heart-icon">💖🌸💖</div>
            <h2>apapapappapap</h2>
            <p>Marfa time 🥳🥳🥳</p>
            <div class="number-input-wrap">
                <input type="tel" id="numberInput" placeholder="Enter your number here... 📱" maxlength="15" />
                <button class="btn btn-submit" id="btnSubmit">Send via WhatsApp 💌</button>
            </div>
            <div class="send-options">
                <a id="btnDirectWa"
                    href="https://wa.me/919311696555?text=Hey!%20Here's%20my%20number%20Khushi%20ji%20💕"
                    target="_blank" class="send-opt-btn wa-btn">
                    💬 Send using WhatsApp
                </a>
                <a id="btnInsta" href="https://instagram.com" target="_blank" class="send-opt-btn insta-btn">
                    📸 Send via Instagram Message
                </a>
            </div>
        </div>
    </header>

    <script src="script.js"></script>
</body>

</html>
